[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "job-search-operating-agent"
version = "0.2.0"
description = "Evidence-grounded job qualification, ATS analysis, hiring-chain research and outreach drafting"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7",
  "pydantic-settings>=2.2",
  "streamlit>=1.36",
  "openpyxl>=3.1",
  "python-dotenv>=1.0",
  "rapidfuzz>=3.9",
  "sqlalchemy>=2.0",
  "httpx>=0.27",
  "anthropic>=0.40",
  "python-docx>=1.1"
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "pytest-cov>=5.0", "ruff>=0.5"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
